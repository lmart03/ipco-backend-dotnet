name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore Ipco.slnx

      - name: Build
        run: dotnet build Ipco.slnx --configuration Release --no-restore

      - name: Test domain
        run: dotnet test tests/Ipco.Domain.UnitTests/Ipco.Domain.UnitTests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Test patients module
        run: dotnet test tests/Ipco.Modules.Patients.UnitTests/Ipco.Modules.Patients.UnitTests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Test architecture
        run: dotnet test tests/Ipco.ArchitectureTests/Ipco.ArchitectureTests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Test API integration
        id: api-integration-tests
        continue-on-error: true
        run: dotnet test tests/Ipco.Api.IntegrationTests/Ipco.Api.IntegrationTests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Report API integration failures
        if: steps.api-integration-tests.outcome == 'failure'
        shell: pwsh
        run: |
          $results = Select-Xml -Path "tests/Ipco.Api.IntegrationTests/TestResults/test-results.trx" -XPath "//*[local-name()='UnitTestResult' and @outcome='Failed']"
          foreach ($result in $results) {
            $name = $result.Node.testName
            $message = $result.Node.Output.ErrorInfo.Message -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error title=$name::$message"
          }
          throw "API integration tests failed."

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
